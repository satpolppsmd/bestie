<style>
:root{--biru:#12307a;--biru2:#1f4bb5;--kuning:#f7c600;--bg:#eef2f8;--teks:#1d2433;--abu:#5b6577;--merah:#c62828;--hijau:#1b7f3b;--garis:#d6deeb}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--teks);font-size:16px;line-height:1.45}
header{background:linear-gradient(135deg,var(--biru),var(--biru2));color:#fff;padding:16px 16px 18px;text-align:center;border-bottom:4px solid var(--kuning)}
.logos{display:flex;justify-content:center;align-items:center;gap:16px;margin-bottom:8px}
.logos a.kelogo{display:inline-flex;line-height:0;cursor:pointer}
.logos img{height:54px;width:auto;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
header h1{font-size:1.15rem;margin:0 0 3px;letter-spacing:.2px}
header p{margin:0;font-size:.88rem;opacity:.9}
header.kecil{padding:10px 12px 12px}header.kecil .logos img{height:36px}header.kecil .logos{margin-bottom:4px}header.kecil h1{font-size:1rem}header.kecil p{display:none}
main{max-width:640px;margin:0 auto;padding:14px 12px 40px}
.card{background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(18,48,122,.08);padding:16px;margin-bottom:14px}
.card h2{font-size:1.05rem;margin:0 0 10px;color:var(--biru)}
.ilus{width:100%;aspect-ratio:720/483;object-fit:cover;border-radius:12px;display:block;margin-bottom:12px;background:#dfe7f5}
.info{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.95rem}
.info dt{color:var(--abu)}.info dd{margin:0;font-weight:600}
.pita{display:inline-block;background:#fff4c2;color:#6b5300;border-radius:999px;padding:3px 11px;font-size:.82rem;font-weight:700;margin-bottom:8px}
label{display:block;font-weight:600;font-size:.93rem;margin:12px 0 5px}
input[type=text],input[type=tel]{width:100%;padding:12px;border:1.5px solid var(--garis);border-radius:10px;font-size:1rem;font-family:inherit;background:#fff;color:var(--teks)}
input:focus{outline:none;border-color:var(--biru2);box-shadow:0 0 0 3px rgba(31,75,181,.15)}
.dua{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bantu{font-weight:400;color:var(--abu);font-size:.83rem;margin:6px 0 0}
.btn{width:100%;background:var(--kuning);color:#1d2433;border:0;border-radius:12px;padding:15px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 2px 0 #c49d00;font-family:inherit}
.btn:disabled{opacity:.6;cursor:wait}
.btn.biru{background:var(--biru2);color:#fff;box-shadow:0 2px 0 #12307a}
.btn.garis{background:#fff;color:var(--biru2);border:1.5px solid var(--biru2);box-shadow:none}
.galat{background:#fdecea;color:var(--merah);border-radius:10px;padding:11px 13px;margin:10px 0;font-size:.93rem}
.galat:empty{display:none}
.tunggu{text-align:center;color:var(--abu);padding:6px 0}
.tunggu b{display:block;color:var(--teks);font-size:1.05rem;margin-bottom:4px}
.putar{width:34px;height:34px;border:4px solid #d6deeb;border-top-color:var(--biru2);border-radius:50%;animation:putar 1s linear infinite;margin:6px auto 12px}
@keyframes putar{to{transform:rotate(360deg)}}
/* tes */
.batang{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--garis);padding:10px 12px}
.batang .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
.batang .lbl{font-weight:700;color:var(--biru);font-size:.95rem;flex:1}
.waktu{font-variant-numeric:tabular-nums;font-weight:700;background:#eef3ff;color:var(--biru);border-radius:999px;padding:5px 12px;font-size:.95rem}
.waktu.habis{background:#fdecea;color:var(--merah)}
.prog{height:6px;background:#e3e8f2;border-radius:3px;margin-top:8px;overflow:hidden;max-width:640px;margin-left:auto;margin-right:auto}
.prog i{display:block;height:100%;background:var(--kuning);transition:width .2s}
.peringatan{background:#fdecea;color:var(--merah);border-radius:10px;padding:10px 12px;font-weight:600;font-size:.92rem;margin-bottom:12px}
.tanya{font-size:1.07rem;font-weight:600;margin:0 0 14px;line-height:1.5}
.nomor{color:var(--abu);font-size:.85rem;font-weight:600;margin-bottom:6px}
.pil{display:grid;gap:10px}
.pil button{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:1.5px solid var(--garis);border-radius:12px;padding:13px;font-size:1rem;font-family:inherit;color:var(--teks);cursor:pointer;line-height:1.4}
.pil button .h{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--garis);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;color:var(--abu)}
.pil button.on{border-color:var(--biru2);background:#eef3ff}
.pil button.on .h{background:var(--biru2);border-color:var(--biru2);color:#fff}
.nav{display:flex;gap:10px;margin-top:16px}
.nav .btn{flex:1;padding:13px}
.titik{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px}
.titik button{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--garis);background:#fff;font-weight:600;font-size:.85rem;color:var(--abu);cursor:pointer;font-family:inherit}
.titik button.isi{background:#eef3ff;border-color:#a9bdf0;color:var(--biru)}
.titik button.ini{border-color:var(--biru2);box-shadow:0 0 0 2px rgba(31,75,181,.25)}
.ringkas{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}
.ringkas button{padding:10px 0;border-radius:10px;border:1.5px solid var(--garis);background:#fff;font-weight:700;font-family:inherit;cursor:pointer;color:var(--teks)}
.ringkas button.isi{background:#e8f6ec;border-color:#9fd3ae;color:var(--hijau)}
.ringkas button.kosong{background:#fdecea;border-color:#efb1b1;color:var(--merah)}
.skor{font-size:3.4rem;font-weight:800;color:var(--biru);text-align:center;line-height:1;margin:6px 0}
.tengah{text-align:center}
.ok{width:58px;height:58px;border-radius:50%;background:#e8f6ec;color:var(--hijau);display:flex;align-items:center;justify-content:center;font-size:30px;margin:4px auto 10px}
.kaki{text-align:center;color:var(--abu);font-size:.8rem;margin-top:8px}
.hide{display:none!important}
</style>
</head>

var DURASI = 5 * 60;
var S = null;          // info sesi dari server
var T = null;          // tes yang sedang dikerjakan
var tPoll = null, tJam = null;

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
var BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function tglIndo(t){ var p=String(t||'').slice(0,10).split('-'); return p.length<3?(t||'–'):(+p[2])+' '+BLN[+p[1]-1]+' '+p[0]; }
function baca(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }
function tulis(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function acak(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var x=a[i]; a[i]=a[j]; a[j]=x; } return a; }
function idBaru(){ var c='abcdefghijkmnpqrstuvwxyz23456789', s=''; var r=(window.crypto&&crypto.getRandomValues)?crypto.getRandomValues(new Uint8Array(20)):null; for(var i=0;i<20;i++) s+=c.charAt((r?r[i]:Math.floor(Math.random()*256))%c.length); return s; }
function namaTes(t){ return t==='pre'?'Pre-test':'Post-test'; }
function kunciTes(){ return 'bestie_tes_'+S.kode+'_'+T.tes; }

/* ---------- komunikasi dengan server (dengan coba ulang saat ramai) ---------- */
function minta(data, opsi){
  opsi = opsi || {}; var maks = opsi.maks || 8, ke = 0;
  return new Promise(function(berhasil, gagal){
    function coba(){
      ke++; if(opsi.tiap) opsi.tiap(ke);
      fetch(API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(data), redirect:'follow' })
        .then(function(r){ return r.text(); })
        .then(function(t){
          var j; try{ j=JSON.parse(t); }catch(e){ throw { ulang:true }; }   // halaman galat Google = server penuh
          if(j.ok===false && j.sibuk) throw { ulang:true };
          berhasil(j);
        })
        .catch(function(e){
          if(ke>=maks) return gagal(new Error('Koneksi ke server gagal. Periksa internet lalu coba lagi.'));
          var jeda = Math.min(15000, 1200*Math.pow(1.6, ke-1)) * (0.6 + Math.random()*0.8);
          setTimeout(coba, jeda);
        });
    }
    coba();
  });
}

/* ---------- alur halaman ---------- */
function kodeDariUrl(){ var m=location.search.match(/[?&]k=([^&#]+)/); return m ? decodeURIComponent(m[1]).toUpperCase().replace(/[^A-Z0-9-]/g,'') : ''; }
function kepalaKecil(on){ $('kepala').classList.toggle('kecil', !!on); }

function mulai(){
  var k = kodeDariUrl();
  if(!k){ layarKode(); return; }
  muatSesi(k);
}

function layarKode(pesan){
  berhentiPoll(); kepalaKecil(false); $('batang').classList.add('hide');
  $('isi').innerHTML = '<div class="card"><img class="ilus" alt="" src="'+ILUS+'"><h2>Masukkan kode sesi</h2>'+
    '<p class="bantu" style="margin-top:0">Kode sesi diberikan oleh pendamping, misalnya <b>BST-7KQ4</b>. Kamu juga bisa memindai QR yang ditampilkan.</p>'+
    '<input type="text" id="kode" maxlength="20" placeholder="BST-XXXX" autocapitalize="characters" autocomplete="off" style="text-transform:uppercase;margin-top:10px">'+
    '<div class="galat" id="galat">'+esc(pesan||'')+'</div><button class="btn" id="lanjut" style="margin-top:12px">Lanjut</button></div>';
  $('lanjut').onclick=function(){ var k=$('kode').value.trim().toUpperCase().replace(/[^A-Z0-9-]/g,''); if(!k){ $('galat').textContent='Kode sesi belum diisi.'; return; } history.replaceState(null,'','?k='+encodeURIComponent(k)); muatSesi(k); };
  $('kode').onkeydown=function(e){ if(e.key==='Enter') $('lanjut').click(); };
}

function layarMuat(teks){ $('isi').innerHTML='<div class="card"><div class="tunggu"><div class="putar"></div><b>'+esc(teks||'Memuat…')+'</b></div></div>'; }

function muatSesi(kode, diam){
  if(!diam) layarMuat('Memuat sesi…');
  return minta({ action:'sesi', kode:kode }, { maks: diam?3:8 }).then(function(j){
    if(!j.ok){ if(j.tidakAda){ layarKode(j.error); return; } throw new Error(j.error); }
    S = j; tampilSesi();
  }).catch(function(e){
    if(diam) return;
    $('isi').innerHTML='<div class="card"><div class="galat">'+esc(e.message)+'</div><button class="btn biru" onclick="muatSesi(\''+esc(kode)+'\')">Coba lagi</button></div>';
  });
}

function infoHTML(){
  return '<dl class="info"><dt>Sekolah</dt><dd>'+esc(S.sekolah)+'</dd><dt>Jenjang</dt><dd>'+esc(S.jenjang)+'</dd><dt>Tanggal</dt><dd>'+esc(tglIndo(S.tanggal))+'</dd><dt>Kode sesi</dt><dd>'+esc(S.kode)+'</dd></dl>';
}

function tampilSesi(){
  berhentiPoll(); kepalaKecil(false); $('batang').classList.add('hide');
  // ada pengerjaan yang belum terkirim di HP ini?
  if(S.tes){
    var simpan = baca('bestie_tes_'+S.kode+'_'+S.tes);
    if(simpan && simpan.soal && simpan.soal.length){ T = simpan; if(T.terkirim){ layarHasil(T.hasil); return; } layarSoal(T.posisi||0); return; }
  }
  var h = '<div class="card"><img class="ilus" alt="Ilustrasi siswa bersama petugas Satpol PP" src="'+ILUS+'">'+infoHTML()+'</div>';
  if(!S.tes){
    var pesan = S.status==='Belum dibuka' ? ['Pre-test belum dibuka','Tunggu aba-aba pendamping. Halaman ini akan memeriksa sendiri setiap 30 detik.']
      : S.status==='Ditutup' ? ['Pre-test sudah ditutup','Ikuti sesi BESTIE. Post-test akan dibuka pendamping setelah sesi selesai. Halaman ini memeriksa sendiri setiap 30 detik.']
      : ['Tes sudah selesai','Terima kasih sudah mengikuti BESTIE. Sampai jumpa!'];
    var pre = baca('bestie_tes_'+S.kode+'_pre');
    if(pre && pre.terkirim && S.status!=='Selesai') h += '<div class="card" style="border-left:4px solid var(--hijau)"><b style="color:var(--hijau)">✓ Pre-test kamu sudah tersimpan.</b><div class="bantu">'+esc(pre.identitas.nama)+' · Kelas '+esc(pre.identitas.kelas)+' · No. absen '+esc(pre.identitas.absen)+'</div></div>';
    h += '<div class="card"><div class="tunggu">'+(S.status==='Selesai'?'':'<div class="putar"></div>')+'<b>'+pesan[0]+'</b>'+esc(pesan[1])+'</div>'+
      (S.status==='Selesai'?'':'<button class="btn garis" style="margin-top:12px" id="cekLagi">Periksa sekarang</button>')+'</div>';
    $('isi').innerHTML = h;
    if($('cekLagi')){ $('cekLagi').onclick=function(){ muatSesi(S.kode); }; mulaiPoll(); }
    return;
  }
  var id = baca('bestie_identitas') || {};
  h += '<div class="card"><span class="pita">'+namaTes(S.tes)+' dibuka</span><h2>Isi identitasmu</h2>'+
    '<label for="nama">Nama lengkap</label><input type="text" id="nama" maxlength="80" autocomplete="name" value="'+esc(id.nama||'')+'">'+
    '<div class="dua"><div><label for="kelas">Kelas</label><input type="text" id="kelas" maxlength="12" placeholder="mis. 8B" autocomplete="off" value="'+esc(id.kelas||'')+'"></div>'+
    '<div><label for="absen">No. absen</label><input type="tel" id="absen" maxlength="3" inputmode="numeric" placeholder="mis. 12" autocomplete="off" value="'+esc(id.absen||'')+'"></div></div>'+
    '<p class="bantu">Isi sama persis saat pre-test dan post-test agar nilaimu bisa dipasangkan.</p>'+
    '<div class="galat" id="galat"></div>'+
    '<p class="bantu" style="margin:12px 0">'+S.soal.length+' soal pilihan ganda · waktu '+(DURASI/60)+' menit · '+(S.tes==='pre'?'hanya bisa dikerjakan sekali':'boleh dikerjakan paling banyak 2 kali, nilai terbaik yang dipakai')+'</p>'+
    '<button class="btn" id="mulaiTes">Mulai '+namaTes(S.tes)+'</button></div>';
  $('isi').innerHTML = h;
  $('mulaiTes').onclick = function(){
    var nama=$('nama').value.replace(/\s+/g,' ').trim(), kelas=$('kelas').value.toUpperCase().replace(/\s+/g,''), absen=$('absen').value.replace(/\D/g,'');
    var g=$('galat');
    if(nama.length<2){ g.textContent='Nama wajib diisi.'; $('nama').focus(); return; }
    if(!kelas){ g.textContent='Kelas wajib diisi.'; $('kelas').focus(); return; }
    if(!absen || +absen<1){ g.textContent='Nomor absen wajib diisi dengan angka.'; $('absen').focus(); return; }
    tulis('bestie_identitas', { nama:nama, kelas:kelas, absen:String(+absen) });
    mulaiTes({ nama:nama, kelas:kelas, absen:String(+absen) });
  };
}

function mulaiPoll(){ berhentiPoll(); tPoll=setInterval(function(){ if(document.visibilityState==='visible') muatSesi(S.kode, true); }, 30000 + Math.floor(Math.random()*8000)); }
function berhentiPoll(){ if(tPoll){ clearInterval(tPoll); tPoll=null; } }

/* ---------- mengerjakan ---------- */
function mulaiTes(identitas, ulang){
  T = { kode:S.kode, tes:S.tes, identitas:identitas, mulai:Date.now(), posisi:0, jawaban:{}, idKirim:idBaru(), ulang:!!ulang,
    soal: acak(S.soal).map(function(q){ return { id:q.id, t:q.t, p:q.p, urut: acak([0,1,2,3].slice(0,q.p.length)) }; }) };
  tulis(kunciTes(), T);
  layarSoal(0);
}

function sisaDetik(){ return DURASI - Math.floor((Date.now()-T.mulai)/1000); }
function jalankanJam(){
  if(tJam) clearInterval(tJam);
  function detak(){ var s=sisaDetik(), w=$('waktu'); if(!w) return;
    var a=Math.max(0,s); w.textContent=('0'+Math.floor(a/60)).slice(-2)+':'+('0'+(a%60)).slice(-2);
    w.classList.toggle('habis', s<=0);
    var p=$('peringatan'); if(p) p.classList.toggle('hide', s>0);
  }
  detak(); tJam=setInterval(detak, 1000);
}
function terjawab(){ return T.soal.filter(function(q){ return T.jawaban[q.id]!=null; }).length; }

function layarSoal(i){
  berhentiPoll(); kepalaKecil(true);
  T.posisi=i; tulis(kunciTes(), T);
  var n=T.soal.length, q=T.soal[i];
  $('batang').classList.remove('hide'); $('bLbl').textContent=namaTes(T.tes)+' · Soal '+(i+1)+' dari '+n;
  $('prog').style.width=(terjawab()/n*100)+'%';
  $('isi').innerHTML = '<div class="peringatan hide" id="peringatan">Waktu habis. Segera kirim jawabanmu.</div>'+
    '<div class="card"><div class="nomor">Soal '+(i+1)+'</div><p class="tanya">'+esc(q.t)+'</p><div class="pil" id="pil">'+
    q.urut.map(function(asli, k){ return '<button type="button" data-p="'+asli+'" class="'+(T.jawaban[q.id]===asli?'on':'')+'"><span class="h">'+'ABCD'.charAt(k)+'</span><span>'+esc(q.p[asli])+'</span></button>'; }).join('')+
    '</div><div class="nav"><button class="btn garis" id="sblm" '+(i===0?'disabled':'')+'>‹ Sebelumnya</button>'+
    (i<n-1 ? '<button class="btn biru" id="brkt">Berikutnya ›</button>' : '<button class="btn" id="periksa">Periksa &amp; kirim</button>')+'</div>'+
    '<div class="titik">'+T.soal.map(function(x,k){ return '<button type="button" data-i="'+k+'" class="'+(T.jawaban[x.id]!=null?'isi ':'')+(k===i?'ini':'')+'" aria-label="Soal '+(k+1)+'">'+(k+1)+'</button>'; }).join('')+'</div></div>';
  [].forEach.call($('pil').querySelectorAll('button'), function(b){ b.onclick=function(){
    T.jawaban[q.id]=+this.getAttribute('data-p'); tulis(kunciTes(), T);
    [].forEach.call($('pil').querySelectorAll('button'), function(x){ x.classList.toggle('on', x===b); });
    $('prog').style.width=(terjawab()/n*100)+'%';
    var t=document.querySelector('.titik button[data-i="'+i+'"]'); if(t) t.classList.add('isi');
  }; });
  $('sblm').onclick=function(){ if(i>0) layarSoal(i-1); };
  if($('brkt')) $('brkt').onclick=function(){ layarSoal(i+1); };
  if($('periksa')) $('periksa').onclick=layarPeriksa;
  [].forEach.call(document.querySelectorAll('.titik button'), function(b){ b.onclick=function(){ layarSoal(+this.getAttribute('data-i')); }; });
  jalankanJam(); window.scrollTo(0,0);
}

function layarPeriksa(){
  var n=T.soal.length, k=n-terjawab();
  $('bLbl').textContent=namaTes(T.tes)+' · Periksa jawaban';
  $('isi').innerHTML = '<div class="peringatan hide" id="peringatan">Waktu habis. Segera kirim jawabanmu.</div><div class="card"><h2>Periksa jawabanmu</h2>'+
    '<p style="margin:0">Terjawab <b>'+(n-k)+'</b> dari '+n+' soal.'+(k?' <span style="color:var(--merah);font-weight:600">'+k+' soal belum dijawab.</span>':'')+'</p>'+
    '<div class="ringkas">'+T.soal.map(function(q,i){ return '<button type="button" data-i="'+i+'" class="'+(T.jawaban[q.id]!=null?'isi':'kosong')+'">'+(i+1)+'</button>'; }).join('')+'</div>'+
    '<p class="bantu" style="margin-bottom:12px">Ketuk nomor untuk kembali ke soal itu.</p>'+
    '<div class="galat" id="galat"></div><button class="btn" id="kirimBtn">Kirim jawaban</button>'+
    '<div class="kaki">'+esc(T.identitas.nama)+' · Kelas '+esc(T.identitas.kelas)+' · No. absen '+esc(T.identitas.absen)+'</div></div>';
  [].forEach.call(document.querySelectorAll('.ringkas button'), function(b){ b.onclick=function(){ layarSoal(+this.getAttribute('data-i')); }; });
  $('kirimBtn').onclick=function(){
    if(k && !confirm(k+' soal belum dijawab dan akan dihitung salah. Tetap kirim?')) return;
    kirimJawaban();
  };
  jalankanJam(); window.scrollTo(0,0);
}

function kirimJawaban(){
  var b=$('kirimBtn'), g=$('galat'); b.disabled=true; g.textContent='';
  var data={ action:'kirim', kode:T.kode, tes:T.tes, nama:T.identitas.nama, kelas:T.identitas.kelas, absen:T.identitas.absen,
    jawaban:T.jawaban, durasi:Math.floor((Date.now()-T.mulai)/1000), idKirim:T.idKirim };
  minta(data, { maks:10, tiap:function(ke){ b.textContent = ke>1 ? 'Server ramai, mencoba lagi ('+ke+')…' : 'Mengirim…'; } })
    .then(function(j){
      if(j.ok || j.sudah || j.habis){ T.terkirim=true; T.hasil=j; tulis(kunciTes(), T); layarHasil(j); return; }
      throw new Error(j.error || 'Gagal mengirim.');
    })
    .catch(function(e){ g.textContent=e.message+' Jawabanmu tetap tersimpan di HP ini.'; b.disabled=false; b.textContent='Coba kirim lagi'; });
}

function layarHasil(j){
  if(tJam){ clearInterval(tJam); tJam=null; }
  $('batang').classList.add('hide'); kepalaKecil(false);
  var h='<div class="card tengah">';
  if(j.sudah){
    h+='<h2>Pre-test sudah pernah dikerjakan</h2><p>'+esc(j.error)+'</p><p class="bantu">Kalau ini keliru (mis. salah tulis kelas/absen), beri tahu pendamping.</p>';
  } else if(j.habis){
    h+='<h2>Kesempatan post-test habis</h2><p class="bantu" style="margin:0">Nilai tertinggimu</p><div class="skor">'+j.tertinggi+'</div><p>Terima kasih sudah mengikuti BESTIE!</p>';
  } else if(j.tes==='pre'){
    h+='<div class="ok">✓</div><h2>Pre-test tersimpan</h2><p>Terima kasih, '+esc(T.identitas.nama.split(' ')[0])+'! Sekarang ikuti sesi BESTIE dengan saksama. Post-test akan dibuka pendamping setelah sesi selesai.</p>'+
      '<p class="bantu">Untuk post-test nanti, pindai QR yang sama atau buka kembali halaman ini.</p>';
  } else {
    h+='<p class="bantu" style="margin:0">Nilai post-test '+(j.percobaan>1?'ke-'+j.percobaan:'')+'</p><div class="skor">'+j.skor+'</div>'+
      '<p style="margin:4px 0 10px">Benar '+j.benar+' dari '+j.jumlah+' soal'+(j.percobaan>1?' · nilai tertinggimu <b>'+j.tertinggi+'</b>':'')+'</p>'+
      (j.skor>=70?'<p style="color:var(--hijau);font-weight:700;margin:0 0 10px">Hebat, kamu sudah memahami materi BESTIE!</p>':'');
    if(j.sisa>0) h+='<p class="bantu">Kamu masih punya '+j.sisa+' kesempatan lagi. Nilai terbaik yang dipakai.</p><button class="btn garis" id="ulang" style="margin-top:6px">Kerjakan ulang post-test</button>';
    else h+='<p class="bantu">Terima kasih sudah mengikuti BESTIE!</p>';
  }
  h+='<div class="kaki" style="margin-top:14px">'+esc(S?S.sekolah:'')+' · '+(T?esc(T.identitas.nama)+' · Kelas '+esc(T.identitas.kelas)+' · No. '+esc(T.identitas.absen):'')+'</div></div>';
  $('isi').innerHTML=h;
  if(S && (j.tes==='pre' || j.sudah)) mulaiPoll();   // lanjut otomatis ke post-test saat dibuka
  if($('ulang')) $('ulang').onclick=function(){
    if(!confirm('Kerjakan ulang post-test? Ini kesempatan terakhirmu, dan nilai terbaik yang akan dipakai.')) return;
    muatSesi(S.kode, true).then(function(){
      if(!S.tes || S.tes!=='post'){ tampilSesi(); return; }
      mulaiTes(T.identitas, true);
    });
  };
  window.scrollTo(0,0);
}

/* logo: konfirmasi bila sedang mengerjakan dan belum terkirim */
document.addEventListener('click', function(e){
  var a=e.target.closest && e.target.closest('a.kelogo'); if(!a) return;
  if(T && !T.terkirim && Object.keys(T.jawaban||{}).length && !confirm('Jawabanmu belum dikirim. Tetap pindah ke halaman utama? (Jawaban tetap tersimpan di HP ini.)')) e.preventDefault();
});
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible' && tPoll && S) muatSesi(S.kode, true); });

mulai();
</script>
</body>
</html>
