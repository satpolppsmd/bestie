<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pre-test & Post-test BESTIE · Satpol PP Kab. Sumedang</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{--biru:#12307a;--biru2:#1f4bb5;--kuning:#f7c600;--bg:#eef2f8;--teks:#1d2433;--abu:#5b6577;--merah:#c62828;--hijau:#1b7f3b;--garis:#d6deeb}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--teks);font-size:16px;line-height:1.45}
header{background:linear-gradient(135deg,var(--biru),var(--biru2));color:#fff;padding:16px 16px 18px;text-align:center;border-bottom:4px solid var(--kuning)}
.logos{display:flex;justify-content:center;align-items:center;gap:16px;margin-bottom:8px}
.logos a.kelogo{display:inline-flex;line-height:0;cursor:pointer}
.logos img{height:54px;width:auto;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
header h1{font-size:1.15rem;margin:0 0 3px;letter-spacing:.2px}
header p{margin:0;font-size:.88rem;opacity:.9}
header.kecil{padding:10px 12px 12px}header.kecil .logos img{height:36px}header.kecil .logos{margin-bottom:4px}header.kecil h1{font-size:1rem}header.kecil p{display:none}
main{max-width:640px;margin:0 auto;padding:14px 12px 40px}
.card{background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(18,48,122,.08);padding:16px;margin-bottom:14px}
.card h2{font-size:1.05rem;margin:0 0 10px;color:var(--biru)}
.ilus{width:100%;aspect-ratio:720/483;object-fit:cover;border-radius:12px;display:block;margin-bottom:12px;background:#dfe7f5}
.info{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.95rem}
.info dt{color:var(--abu)}.info dd{margin:0;font-weight:600}
.pita{display:inline-block;background:#fff4c2;color:#6b5300;border-radius:999px;padding:3px 11px;font-size:.82rem;font-weight:700;margin-bottom:8px}
label{display:block;font-weight:600;font-size:.93rem;margin:12px 0 5px}
input[type=text],input[type=tel]{width:100%;padding:12px;border:1.5px solid var(--garis);border-radius:10px;font-size:1rem;font-family:inherit;background:#fff;color:var(--teks)}
input:focus{outline:none;border-color:var(--biru2);box-shadow:0 0 0 3px rgba(31,75,181,.15)}
.dua{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bantu{font-weight:400;color:var(--abu);font-size:.83rem;margin:6px 0 0}
.btn{width:100%;background:var(--kuning);color:#1d2433;border:0;border-radius:12px;padding:15px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 2px 0 #c49d00;font-family:inherit}
.btn:disabled{opacity:.6;cursor:wait}
.btn.biru{background:var(--biru2);color:#fff;box-shadow:0 2px 0 #12307a}
.btn.garis{background:#fff;color:var(--biru2);border:1.5px solid var(--biru2);box-shadow:none}
.galat{background:#fdecea;color:var(--merah);border-radius:10px;padding:11px 13px;margin:10px 0;font-size:.93rem}
.galat:empty{display:none}
.galat.info{background:#fff4c2;color:#6b5300}
.tunggu{text-align:center;color:var(--abu);padding:6px 0}
.tunggu b{display:block;color:var(--teks);font-size:1.05rem;margin-bottom:4px}
.putar{width:34px;height:34px;border:4px solid #d6deeb;border-top-color:var(--biru2);border-radius:50%;animation:putar 1s linear infinite;margin:6px auto 12px}
@keyframes putar{to{transform:rotate(360deg)}}
/* tes */
.batang{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--garis);padding:10px 12px}
.batang .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
.batang .lbl{font-weight:700;color:var(--biru);font-size:.95rem;flex:1}
.waktu{font-variant-numeric:tabular-nums;font-weight:700;background:#eef3ff;color:var(--biru);border-radius:999px;padding:5px 12px;font-size:.95rem}
.waktu.habis{background:#fdecea;color:var(--merah)}
.prog{height:6px;background:#e3e8f2;border-radius:3px;margin-top:8px;overflow:hidden;max-width:640px;margin-left:auto;margin-right:auto}
.prog i{display:block;height:100%;background:var(--kuning);transition:width .2s}
.peringatan{background:#fdecea;color:var(--merah);border-radius:10px;padding:10px 12px;font-weight:600;font-size:.92rem;margin-bottom:12px}
.tanya{font-size:1.07rem;font-weight:600;margin:0 0 14px;line-height:1.5}
.nomor{color:var(--abu);font-size:.85rem;font-weight:600;margin-bottom:6px}
.pil{display:grid;gap:10px}
.pil button{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:1.5px solid var(--garis);border-radius:12px;padding:13px;font-size:1rem;font-family:inherit;color:var(--teks);cursor:pointer;line-height:1.4}
.pil button .h{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--garis);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;color:var(--abu)}
.pil button.on{border-color:var(--biru2);background:#eef3ff}
.pil button.on .h{background:var(--biru2);border-color:var(--biru2);color:#fff}
.nav{display:flex;gap:10px;margin-top:16px}
.nav .btn{flex:1;padding:13px}
.titik{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px}
.titik button{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--garis);background:#fff;font-weight:600;font-size:.85rem;color:var(--abu);cursor:pointer;font-family:inherit}
.titik button.isi{background:#eef3ff;border-color:#a9bdf0;color:var(--biru)}
.titik button.ini{border-color:var(--biru2);box-shadow:0 0 0 2px rgba(31,75,181,.25)}
.ringkas{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}
.ringkas button{padding:10px 0;border-radius:10px;border:1.5px solid var(--garis);background:#fff;font-weight:700;font-family:inherit;cursor:pointer;color:var(--teks)}
.ringkas button.isi{background:#e8f6ec;border-color:#9fd3ae;color:var(--hijau)}
.ringkas button.kosong{background:#fdecea;border-color:#efb1b1;color:var(--merah)}
.banding{border-radius:12px;padding:10px 12px;margin:2px 0 12px;text-align:left;font-size:.88rem;border:1px solid}
.banding.naik{background:#eaf6ee;border-color:#b9e0c6;color:var(--hijau)}
.banding.turun{background:#fdeeee;border-color:#f3c2c2;color:var(--merah)}
.banding.tetap{background:#f1f4f9;border-color:var(--garis);color:var(--abu)}
.bandingBaris{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;color:var(--teks)}
.banding .selisih{font-weight:800;white-space:nowrap}
.banding.naik .selisih{color:var(--hijau)}.banding.turun .selisih{color:var(--merah)}.banding.tetap .selisih{color:var(--abu)}
.banding p{margin:6px 0 0;font-weight:600}
.skor{font-size:3.4rem;font-weight:800;color:var(--biru);text-align:center;line-height:1;margin:6px 0}
.tengah{text-align:center}
.ok{width:58px;height:58px;border-radius:50%;background:#e8f6ec;color:var(--hijau);display:flex;align-items:center;justify-content:center;font-size:30px;margin:4px auto 10px}
.kaki{text-align:center;color:var(--abu);font-size:.8rem;margin-top:8px}
.hide{display:none!important}
/* kuesioner */
.kueAtas{background:#eef3ff;border-radius:10px;padding:10px 12px;font-size:.9rem;margin:0 0 4px}
.butir{border-top:1px solid var(--garis);padding:14px 0 12px}
.butir:first-of-type{border-top:0}
.butir .tanyaK{font-weight:600;margin:0;line-height:1.45}
.butir .tanyaK i{font-style:normal;color:var(--abu);margin-right:4px}
.butir.kurang .tanyaK{color:var(--merah)}
.butir.kurang .lik button{border-color:#efb1b1}
.lik{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.lik button{border:1.5px solid var(--garis);border-radius:10px;background:#fff;padding:8px 2px 7px;font-family:inherit;cursor:pointer;color:var(--abu);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;min-height:76px;-webkit-tap-highlight-color:transparent}
.lik button b{font-size:1.15rem;color:var(--teks);line-height:1}
.lik button span{font-size:.68rem;line-height:1.15;text-align:center}
.lik button.on{border-color:var(--biru2);background:var(--biru2);color:#fff}
.lik button.on b{color:#fff}
textarea{width:100%;padding:12px;border:1.5px solid var(--garis);border-radius:10px;font-size:1rem;font-family:inherit;background:#fff;color:var(--teks);resize:vertical}
textarea:focus{outline:none;border-color:var(--biru2);box-shadow:0 0 0 3px rgba(31,75,181,.15)}
/* buklet */
.buk .bukIsi{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.buk .bukHitung{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;justify-content:space-between;background:#fff4c2;color:#6b5300;border-radius:10px;padding:8px 10px;margin:0 0 12px;font-weight:600;font-size:.92rem}
.buk .bukHitung b{font-size:1.1rem}
.buk .bukAksi{display:flex;gap:6px}
.buk .bukAksi .btn{width:auto;padding:6px 12px;font-size:.85rem;margin:0}
.buk .bukIkon{flex:none;width:44px;height:44px;border-radius:12px;background:#eef3ff;display:flex;align-items:center;justify-content:center;font-size:24px}
.buk b{color:var(--biru);font-size:1rem}
.buk .bantu{margin-top:2px}
body.bukaBuklet{overflow:hidden}
#buklet{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:#E9E4DA}
#buklet .bBar{flex:none;background:linear-gradient(135deg,var(--biru),var(--biru2));color:#fff;border-bottom:3px solid var(--kuning);padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));display:flex;align-items:center;gap:8px}
#buklet .bJudul{flex:1;min-width:0;font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#buklet .bTombol{flex:none;display:inline-flex;align-items:center;gap:5px;border-radius:10px;padding:8px 11px;font-size:.88rem;font-weight:700;font-family:inherit;cursor:pointer;text-decoration:none;border:0;line-height:1.2}
#buklet .bUnduh{background:var(--kuning);color:#1d2433}
#buklet .bTutup{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.45)}
#buklet .bPita{flex:none;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff4c2;color:#6b5300;font-weight:700;font-size:.9rem;padding:8px 12px;border-bottom:1px solid #ecd77a}
#buklet .bPita button{background:var(--biru2);color:#fff;border:0;border-radius:999px;padding:5px 14px;font-weight:700;font-family:inherit;font-size:.88rem;cursor:pointer}
@media (max-width:440px){#buklet .bPanjang{display:none}}
#buklet .bBadan{flex:1;position:relative;min-height:0}
#buklet iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}
#buklet .bMuat{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--abu);font-weight:600}
#buklet .bDialog{position:absolute;inset:0;z-index:2;background:rgba(18,30,60,.45);display:flex;align-items:center;justify-content:center;padding:20px}
#buklet .bDialog .card{max-width:360px;width:100%;text-align:center;margin:0}
#buklet .bDialog h2{font-size:1.15rem;margin:4px 0 6px}
#buklet .bDialog .nav{flex-direction:column;gap:8px;margin-top:14px}
/* mode langsung (ala Kahoot) */
.lvKepala{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:.92rem;color:var(--abu);margin-bottom:8px}
.lvKepala .lvPoin{background:var(--biru);color:#fff;border-radius:20px;padding:4px 11px;font-size:.85rem}
.lvTanya{font-size:1.12rem;font-weight:700;line-height:1.4;margin:4px 0 12px}
.lvPil{display:grid;gap:9px}
.lvPil button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-radius:12px;padding:13px 12px;color:#fff;font-size:1rem;font-weight:600;font-family:inherit;cursor:pointer;min-height:58px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.lvPil button .bt{flex:none;width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:1rem}
.lvPil button.w0{background:#e21b3c}.lvPil button.w1{background:#1368ce}.lvPil button.w2{background:#c79100}.lvPil button.w3{background:#26890c}
.lvPil button:disabled{opacity:.35;cursor:default}
.lvPil button.dipilih{opacity:1;outline:4px solid #1d2433;outline-offset:2px}
.lvPil button.kunci{opacity:1}
.lvJam{height:10px;border-radius:6px;background:var(--garis);overflow:hidden;margin:2px 0 12px}
.lvJam i{display:block;height:100%;background:var(--biru2);transition:width .25s linear}
.lvBesar{font-size:3.2rem;font-weight:800;color:var(--biru);text-align:center;line-height:1.1;margin:8px 0}
.lvHasil{border-radius:14px;padding:16px;text-align:center;color:#fff;margin-bottom:12px}
.lvHasil.benar{background:#26890c}.lvHasil.salah{background:#e21b3c}.lvHasil.kosong{background:#5b6577}
.lvHasil h2{margin:0 0 4px;color:#fff}
.lvRank{display:flex;justify-content:space-around;text-align:center;margin-top:6px}
.lvRank b{display:block;font-size:1.6rem;color:var(--biru)}
</style>
</head>

            if(!(e && e.cf)){                                              // Cloudflare tidak terjangkau (mis. workers.dev diblokir provider)
              if(++gagalJar >= 2){
                if(API_CF2 && cfUrl()!==API_CF2){ tulis('bestie_cf2', Date.now()+8*3600000); gagalJar=0; return coba(); }   // alamat utama diblokir: pakai alamat Worker cadangan 8 jam
                pakaiCadangan(8*3600000); return coba();                     // keduanya tidak terjangkau: pakai Apps Script 8 jam
              }
              return setTimeout(coba, 800);
            }
            if(++gagalCF >= 4){ pakaiCadangan(10*60000); return coba(); }   // 4x gagal berturut-turut: pakai Apps Script 10 menit
            return setTimeout(coba, 1000 + Math.random()*1500*gagalCF);       // padat sesaat: coba lagi dengan jeda acak
          }
          if(!opsi.terus && ke>=maks) return gagal(new Error('Koneksi ke server gagal. Periksa internet lalu coba lagi.'));
          var jeda = Math.min(opsi.terus?20000:15000, 1200*Math.pow(1.6, Math.min(ke,12)-1)) * (0.6 + Math.random()*0.8);
          setTimeout(coba, jeda);
        });
    }
    coba();
  });
}

function kodeDariUrl(){ var m=location.search.match(/[?&]k=([^&#]+)/); return m ? decodeURIComponent(m[1]).toUpperCase().replace(/[^A-Z0-9-]/g,'') : ''; }

/* ada kiriman (post-test/pre-test/kuesioner) yang belum selesai di HP ini untuk sesi ini? */
function adaTertunda(kode){

    if(!j.ok){ if(j.tidakAda){ layarKode(j.error); return; } throw new Error(j.error); }
    S = j; if(kodeDariUrl()!==S.kode){ try{ history.replaceState(null,'','?k='+encodeURIComponent(S.kode)); }catch(e){} }
    tampilSesi();
  }).catch(function(e){

    $('isi').innerHTML = h;

    '<div><label for="absen">No. absen di kelas</label><input type="tel" id="absen" maxlength="3" inputmode="numeric" placeholder="mis. 12" autocomplete="off" value="'+esc(id.absen||'')+'"></div></div>'+

function identitasDraf(){

function ambilIdentitas(){

/* Menunggu tes dibuka. Jalur Cloudflare: "menunggu kabar" (satu permintaan ditahan ±4 menit, status baru tiba ±5 detik).
   Jalur cadangan: memeriksa sendiri kira-kira tiap 45 detik. */
var tTunggu = null;
function mulaiPoll(){
  berhentiPoll();
  if(cfAktif()){ tungguKabar(0); return; }
  tPoll=setInterval(function(){ if(document.visibilityState==='visible') muatSesi(S.kode, true); }, 45000 + Math.floor(Math.random()*10000));
}
function tungguKabar(gagal){
  var token = {}; tTunggu = token; var st = S.status, kode = S.kode, lv = S.tes==='post' ? !!S.langsung : null;
  var minta1 = { action:'tunggu', kode:kode, status:st }; if(lv!==null) minta1.langsung = lv;
  kirimKe(cfUrl(), minta1, 290000).then(function(r){
    if(tTunggu!==token) return;
    var j = JSON.parse(r.teks);
    if(!j.ok){ if(j.cadangan) pakaiCadangan(2*60000); throw 0; }
    if(!S || S.kode!==kode) return;
    if(j.status!==S.status || (lv!==null && !!j.langsung!==lv)){ S=j; tampilSesi(); return; }          // tampilSesi memulai penantian berikutnya bila perlu
    tungguKabar(0);
  }).catch(function(){
    if(tTunggu!==token) return;
    tTunggu = null;
    if(gagal < 2 && cfAktif()) { setTimeout(function(){ if(!tPoll && !tTunggu && S) tungguKabar(gagal+1); }, 5000); return; }
    tPoll=setInterval(function(){ if(document.visibilityState==='visible') muatSesi(S.kode, true); }, 45000 + Math.floor(Math.random()*10000));
  });
}
function berhentiPoll(){ if(tPoll){ clearInterval(tPoll); tPoll=null; } tTunggu=null; }

/* ---------- mengerjakan ---------- */
function mulaiTes(identitas, ulang){
  T = { kode:S.kode, tes:S.tes, identitas:identitas, mulai:Date.now(), posisi:0, jawaban:{}, idKirim:idBaru(), ulang:!!ulang,
    soal: acak(S.soal).map(function(q){ return { id:q.id, t:q.t, p:q.p, urut: acak([0,1,2,3].slice(0,q.p.length)) }; }) };
  tulis(kunciTes(), T);
  layarSoal(0);
}

function sisaDetik(){ return DURASI - Math.floor((Date.now()-T.mulai)/1000); }
function jalankanJam(){
  if(tJam) clearInterval(tJam);
  function detak(){ var s=sisaDetik(), w=$('waktu'); if(!w) return;
    var a=Math.max(0,s); w.textContent=('0'+Math.floor(a/60)).slice(-2)+':'+('0'+(a%60)).slice(-2);
    w.classList.toggle('habis', s<=0);

}
function terjawab(){ return T.soal.filter(function(q){ return T.jawaban[q.id]!=null; }).length; }

function layarSoal(i){
  berhentiPoll(); kepalaKecil(true);

    '</div><div class="nav"><button class="btn garis" id="sblm" '+(i===0?'disabled':'')+'>‹ Sebelumnya</button>'+

    '<div class="titik">'+T.soal.map(function(x,k){ return '<button type="button" data-i="'+k+'" class="'+(T.jawaban[x.id]!=null?'isi ':'')+(k===i?'ini':'')+'" aria-label="Soal '+(k+1)+'">'+(k+1)+'</button>'; }).join('')+'</div></div>';
  [].forEach.call($('pil').querySelectorAll('button'), function(b){ b.onclick=function(){

  $('sblm').onclick=function(){ if(i>0) layarSoal(i-1); };
  if($('brkt')) $('brkt').onclick=function(){ layarSoal(i+1); };

  [].forEach.call(document.querySelectorAll('.ringkas button'), function(b){ b.onclick=function(){ layarSoal(+this.getAttribute('data-i')); }; });
  $('kirimBtn').onclick=function(){

function catatanRamai(ke){ return ke>=4 ? 'Server sedang ramai. Isianmu aman di HP ini dan halaman ini terus mencoba mengirim sendiri. Jangan tutup halaman ini.' : ''; }
function kirimJawaban(){
  var b=$('kirimBtn'), g=$('galat'); b.disabled=true; g.textContent='';

    jawaban:T.jawaban, durasi:Math.floor((Date.now()-T.mulai)/1000), idKirim:T.idKirim };

    .then(function(j){

/* pilihan pesan tetap untuk siswa yang sama (tidak berganti saat halaman dimuat ulang), tapi beda antarsiswa */
function pilihB(a, kunci){ var h=0, k=String(kunci||''); for(var i=0;i<k.length;i++) h=(h*31+k.charCodeAt(i))>>>0; return a[h % a.length]; }
function bandingHTML(pre, post){
  if(pre===undefined || pre===null || pre==='' || isNaN(+pre) || post===undefined) return '';
  pre=+pre; post=+post; var d=post-pre;
  var jenis = d>0 ? 'naik' : d<0 ? 'turun' : (post>70 ? 'pahamTetap' : 'tetap');
  var kelas = jenis==='naik'||jenis==='pahamTetap' ? 'naik' : jenis==='turun' ? 'turun' : 'tetap';

/* ---------- mode langsung (post-test ala Kahoot) ---------- */
/* Hanya lewat jalur Cloudflare. Soal maju bersamaan dipandu pendamping; HP menunggu kabar (versi) lalu menampilkan keadaan terbaru. */
var LV = null, LV_W = ['w0','w1','w2','w3'], LV_B = ['▲','◆','●','■'];
function lvSimpan(){ if(LV) tulis('bestie_live_'+LV.kode, { identitas:LV.identitas, jawab:LV.jawab, tunggu:LV.tunggu||false }); }
function lvMinta(data, kali){
  kali = kali || 0;
  return kirimKe(cfUrl(), data, 30000).then(function(r){
    var j; try{ j=JSON.parse(r.teks); }catch(e){ j=null; }
    if(!j || r.status>=500 || r.status===429) throw { ulang:true };
    return j;
  }).catch(function(e){
    if(kali>=6) throw new Error('Koneksi ke server permainan terputus. Periksa internet.');
    return new Promise(function(ok){ setTimeout(ok, 700 + Math.random()*900*(kali+1)); }).then(function(){ return lvMinta(data, kali+1); });
  });
}
function mulaiLive(identitas, lanjut){
  berhentiPoll(); kepalaKecil(true); $('batang').classList.add('hide');
  var lama = baca('bestie_live_'+S.kode) || {};
  LV = { kode:S.kode, identitas:identitas, jawab:(lanjut && lama.jawab) || {}, versi:-1, st:null, token:{}, tunggu:true };
  lvSimpan();

  var d = { action:'liveGabung', kode:S.kode, nama:identitas.nama, kelas:identitas.kelas, absen:identitas.absen };
  lvMinta(d).then(function(j){
    if(!j.ok){ if(j.tidakLangsung){ return lvSelesai(); } throw new Error(j.error); }
    lvTampil(j); lvTunggu();
  }).catch(function(e){ lvGalat(e.message); });
}
function lvGalat(pesan){
  $('isi').innerHTML='<div class="card"><div class="galat">'+esc(pesan)+'</div><button class="btn biru" id="lvUlang">Coba lagi</button></div>';
  $('lvUlang').onclick=function(){ mulaiLive(LV.identitas, true); };
}
function lvTunggu(){
  var token = {}; LV.token = token;
  lvMinta({ action:'liveTunggu', kode:LV.kode, kelas:LV.identitas.kelas, absen:LV.identitas.absen, versi:LV.versi }).then(function(j){
    if(LV.token!==token) return;
    if(!j.ok){ if(j.tidakLangsung) return lvSelesai(); throw new Error(j.error); }
    var baru = j.versi!==LV.versi;
    if(baru) lvTampil(j);
    if(j.tahap==='akhir') return setTimeout(lvSelesai, baru ? 5000 : 0);   // tampilkan peringkat akhir sebentar

}
function lvKepala(j){

var lvJam = null;
function lvTampil(j){

      '<div class="tunggu" style="margin-top:12px"><div class="putar"></div><b>Tunggu pendamping memulai permainan</b>Lihat layar depan. Soal pertama akan muncul sendiri di HP ini.</div></div>';

      if(sisa <= 0){ x.innerHTML = '<p class="tengah"><b>Waktu habis.</b><br>Tunggu hasilnya…</p>'; return true; }
      x.innerHTML = '<div class="lvPil">'+j.soal.p.map(function(p,k){ return '<button type="button" class="'+LV_W[k]+'" data-p="'+k+'"><span class="bt">'+LV_B[k]+'</span><span>'+esc(p)+'</span></button>'; }).join('')+'</div>';
      [].forEach.call(x.querySelectorAll('button'), function(b){ b.onclick=function(){
        var p = +b.getAttribute('data-p'); sudah = p; LV.jawab[j.i] = p; lvSimpan();
        [].forEach.call(x.querySelectorAll('button'), function(y){ y.disabled = true; y.classList.toggle('dipilih', y===b); });
        lvMinta({ action:'liveJawab', kode:LV.kode, kelas:id.kelas, absen:id.absen, i:j.i, pilihan:p }).then(function(r){
          if(!r.ok && r.telat){ var x2=$('lvIsi'); if(x2) x2.innerHTML='<p class="tengah"><b>Terlambat, waktu sudah habis.</b><br>Tunggu soal berikutnya.</p>'; }
          else tampilPil();
        }).catch(function(){ tampilPil(); });

      return true;
    };
    var tahapPil = null;
    var detak = function(){
      var sisa = Math.max(0, batasPada - Date.now()), bar = $('lvJam');
      if(bar) bar.style.width = (Math.min(1, sisa / (20000)) * 100) + '%';
      var siap = mulaiPada > Date.now(), keadaan = siap ? 'siap' : (sudah!==undefined ? 'sudah' : (sisa<=0 ? 'habis' : 'jawab'));
      if(siap || keadaan!==tahapPil){ tahapPil = keadaan; tampilPil(); }
    };
    detak(); lvJam = setInterval(detak, 250);
    return;
  }
  if(j.tahap==='hasil'){
    var s = j.saya || {}, k = j.kunci, kelas = s.pilihan==null ? 'kosong' : (s.pilihan===k ? 'benar' : 'salah');

      '<p style="margin:0 0 6px" class="bantu">Jawaban yang benar:</p><div class="lvPil"><button type="button" class="'+LV_W[k]+' kunci" disabled><span class="bt">'+LV_B[k]+'</span><span>'+esc(j.soal.p[k])+'</span></button></div>'+
      '<div class="lvRank" style="margin-top:14px"><div><b>'+(s.peringkat||'–')+'</b><span class="bantu">peringkat dari '+j.peserta+'</span></div><div><b>'+(s.total||0)+'</b><span class="bantu">total poin</span></div></div>'+
      '<p class="tengah bantu" style="margin-top:12px">'+(j.i+1<j.n?'Soal berikutnya muncul sendiri.':'Itu soal terakhir. Tunggu pengumuman juara!')+'</p></div>';
    $('isi').innerHTML = h; window.scrollTo(0,0); return;
  }
  if(j.tahap==='akhir'){
    var sa = j.saya || {};
    h += '<h2 class="tengah">Permainan selesai!</h2><div class="lvRank"><div><b>'+(sa.peringkat||'–')+'</b><span class="bantu">peringkat dari '+j.peserta+'</span></div><div><b>'+(sa.total||0)+'</b><span class="bantu">total poin</span></div></div>'+
      '<div class="tunggu" style="margin-top:12px"><div class="putar"></div><b>Menyiapkan nilai post-test…</b></div></div>';
    $('isi').innerHTML = h;
  }
}
/* Permainan selesai: ambil hasil sebagai post-test biasa (kuesioner → nilai → buklet). */
function lvSelesai(){

/* ---------- kuesioner pelaksanaan (wajib, sebelum nilai post-test tampil) ---------- */

      LIKERT.map(function(l,k){ var v=k+1; return '<button type="button" role="radio" data-v="'+v+'" aria-checked="'+(T.kues.jawaban[q.id]===v)+'" class="'+(T.kues.jawaban[q.id]===v?'on':'')+'"><b>'+v+'</b><span>'+l+'</span></button>'; }).join('')+'</div></div>'; }).join('')+
    '<label for="saran" style="margin-top:14px">Kritik dan saran untuk kegiatan BESTIE <span style="font-weight:400;color:var(--abu)">(tidak wajib)</span></label>'+

/* ---------- buklet ---------- */
function tesTerkirim(tes){ var x=S?baca('bestie_tes_'+S.kode+'_'+tes):null; return !!(x && x.terkirim); }
/* buklet hanya tampil setelah pre-test (atau pre-test ditutup), dan tidak selama post-test dibuka sebelum siswa mengirim post-test */
function bukletBoleh(){
  if(!S || !BUKLET[S.jenjang]) return false;
  if(S.status==='Ditutup' || S.status==='Selesai') return true;
  if(S.status==='Post-test dibuka') return tesTerkirim('post');
  return tesTerkirim('pre');
}
function bukletHTML(){
  if(!bukletBoleh()) return '';
  return '<div class="card buk"><div class="bukIsi"><div class="bukIkon" aria-hidden="true">📖</div><div><b>Buklet BESTIE '+esc(labelJenjang(S.jenjang))+'</b>'+
    '<div class="bantu">Materi BESTIE untuk dibaca ulang. Bisa juga diunduh sebagai PDF.</div></div></div>'+
    '<button class="btn biru" type="button" onclick="bukaBuklet()">📖 Baca buklet BESTIE</button></div>';
}
/* Setelah post-test (dan kuesioner) selesai: hitung mundur 5 detik lalu buklet terbuka sendiri; bisa dibuka sekarang atau dibatalkan.
   Hanya sekali per HP per sesi, supaya tidak terbuka lagi setiap halaman dimuat ulang. */
var bHitung=null;
function bukletOtomatis(){
  if(!bukletBoleh() || !document.querySelector('.buk')) return;
  var k='bestie_bukotomatis_'+S.kode; if(baca(k)) return;
  tulis(k, 1);
  var d=5, kartu=document.querySelector('.buk'), el=document.createElement('div');
  el.className='bukHitung'; el.setAttribute('role','status');
  el.innerHTML='<span>Buklet terbuka otomatis dalam <b id="bukDetik">'+d+'</b> detik…</span><span class="bukAksi"><button type="button" class="btn kecil" id="bukSekarang">Buka sekarang</button><button type="button" class="btn garis kecil" id="bukBatal">Batal</button></span>';
  kartu.insertBefore(el, kartu.firstChild);
  var henti=function(){ if(bHitung){ clearInterval(bHitung); bHitung=null; } if(el.parentNode) el.remove(); };
  $('bukSekarang').onclick=function(){ henti(); bukaBuklet(); };
  $('bukBatal').onclick=henti;
  bHitung=setInterval(function(){ d--; if(!document.body.contains(el)){ henti(); return; }
    if(d<=0){ henti(); bukaBuklet(); return; } var x=$('bukDetik'); if(x) x.textContent=d; }, 1000);
}
function perangkat(){ var p=baca('bestie_perangkat'); if(!p || !/^[A-Za-z0-9]{8,40}$/.test(p)){ p=idBaru(); tulis('bestie_perangkat', p); } return p; }
/* dicatat sekali per HP per sesi per jenis (lihat/unduh); diam-diam, tidak mengganggu siswa bila gagal */
function catatBuklet(jenis){
  if(!S) return; var k='bestie_buklet_'+S.kode+'_'+jenis;
  if(baca(k)) return;
  minta({ action:'buklet', kode:S.kode, jenis:jenis, perangkat:perangkat() }, { maks:4 }).then(function(j){ if(j.ok) tulis(k, 1); }).catch(function(){});
}
var bJenjang = '', bTunda = false, bRiwayat = false;
function bukaBuklet(){
  if(!bukletBoleh()) return;
  var B=BUKLET[S.jenjang], o=$('buklet');
  if(!o){
    o=document.createElement('div'); o.id='buklet'; o.setAttribute('role','dialog'); o.setAttribute('aria-modal','true'); o.setAttribute('aria-label','Buklet BESTIE');
    o.innerHTML='<div class="bBar"><span class="bJudul" id="bJudul"></span>'+
      '<a class="bTombol bUnduh" id="bUnduh" download>⬇ Unduh PDF</a><button type="button" class="bTombol bTutup" id="bTutup">✕ Tutup</button></div>'+
      '<div class="bPita hide" id="bPita"><span>Post-test dibuka</span><button type="button" id="bPitaMulai">Mulai</button></div>'+
      '<div class="bBadan"><div class="bMuat" id="bMuat"><div class="putar"></div>Memuat buklet…</div><iframe id="bFrame" title="Buklet BESTIE"></iframe>'+
      '<div class="bDialog hide" id="bDialog"><div class="card"><div class="ok" style="background:#fff4c2;color:#6b5300">✎</div><h2>Post-test sudah dibuka!</h2>'+
      '<p class="bantu" style="margin:0">Kamu bisa langsung mengerjakan post-test sekarang.</p>'+
      '<div class="nav"><button class="btn" type="button" id="bMulai">Mulai post-test</button><button class="btn garis" type="button" id="bNanti">Nanti</button></div></div></div></div>';
    document.body.appendChild(o);
    $('bTutup').onclick=tutupBuklet;
    $('bMulai').onclick=tutupBuklet; $('bPitaMulai').onclick=tutupBuklet;
    $('bNanti').onclick=function(){ bTunda=true; cekPostBuklet(); };
    $('bUnduh').onclick=unduhBuklet;
    $('bFrame').onload=function(){ if(this.getAttribute('src')){ $('bMuat').classList.add('hide'); this.style.visibility='visible'; } };
  }
  $('bJudul').innerHTML='Buklet <span class="bPanjang">BESTIE · </span>'+esc(labelJenjang(S.jenjang));
  $('bUnduh').href=B.pdf; $('bUnduh').setAttribute('download', B.pdf.split('/').pop());
  if(bJenjang!==S.jenjang){ bJenjang=S.jenjang; $('bMuat').classList.remove('hide'); $('bFrame').style.visibility='hidden'; $('bFrame').src=B.html; }
  o.classList.remove('hide'); document.body.classList.add('bukaBuklet');
  bTunda=false; cekPostBuklet();
  try{ history.pushState({ buklet:1 }, '', location.href); bRiwayat=true; }catch(e){ bRiwayat=false; }
  catatBuklet('lihat');
}
/* iPhone/iPad: Safari membuka PDF alih-alih mengunduh. PDF diambil dulu sebagai blob (octet-stream) lalu diunduh, sehingga muncul "Unduh?" dan siswa tetap di halaman. */
function iOS(){ return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1); }
var bBlob = null, bSiap = false;
function unduhBuklet(e){
  catatBuklet('unduh');
  if(!iOS() || !window.fetch || !window.Blob || !window.URL) return;      // perangkat lain: unduhan biasa
  e.preventDefault(); if(bSiap) return;
  var a=this, B=BUKLET[S.jenjang], nama=B.pdf.split('/').pop(), teks=a.innerHTML;
  function simpan(url){ var t=document.createElement('a'); t.href=url; t.download=nama; t.style.display='none'; document.body.appendChild(t); t.click(); setTimeout(function(){ t.remove(); }, 1000); }
  if(bBlob && bBlob.pdf===B.pdf){ simpan(bBlob.url); return; }
  bSiap=true; a.innerHTML='Menyiapkan…';
  fetch(B.pdf).then(function(r){ if(!r.ok) throw new Error(); return r.arrayBuffer(); }).then(function(buf){
    if(bBlob) URL.revokeObjectURL(bBlob.url);
    bBlob={ pdf:B.pdf, url:URL.createObjectURL(new Blob([buf], { type:'application/octet-stream' })) };
    a.innerHTML=teks; simpan(bBlob.url);
  }).catch(function(){
    a.innerHTML='Gagal, ulangi'; setTimeout(function(){ a.innerHTML=teks; }, 2500);
  }).then(function(){ bSiap=false; });
}
function bukletTerbuka(){ var o=$('buklet'); return !!(o && !o.classList.contains('hide')); }
function sembunyikanBuklet(){ var o=$('buklet'); if(o) o.classList.add('hide'); document.body.classList.remove('bukaBuklet'); }
/* tombol Tutup: kembali lewat riwayat supaya gestur "kembali" di HP juga menutup buklet */
function tutupBuklet(){ if(!bukletTerbuka()) return; if(bRiwayat){ bRiwayat=false; history.back(); } else sembunyikanBuklet(); window.scrollTo(0,0); }
window.addEventListener('popstate', function(){ if(bukletTerbuka()){ bRiwayat=false; sembunyikanBuklet(); } });
document.addEventListener('keydown', function(e){ if(e.key==='Escape' && bukletTerbuka()) tutupBuklet(); });
/* pemberitahuan saat post-test dibuka ketika siswa sedang membaca buklet (tidak pindah otomatis) */
function cekPostBuklet(){
  if(!$('buklet')) return;
  var post = bukletTerbuka() && S && S.tes==='post' && !tesTerkirim('post');
  $('bDialog').classList.toggle('hide', !post || bTunda);
  $('bPita').classList.toggle('hide', !post || !bTunda);
}

/* logo: konfirmasi bila sedang mengerjakan dan belum terkirim */
document.addEventListener('click', function(e){
  var a=e.target.closest && e.target.closest('a.kelogo'); if(!a) return;
  if(T && !T.terkirim && Object.keys(T.jawaban||{}).length && !confirm('Jawabanmu belum dikirim. Tetap pindah ke halaman utama? (Jawaban tetap tersimpan di HP ini.)')) e.preventDefault();
});
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible' && (tPoll || tTunggu) && S) muatSesi(S.kode, true); });

mulai();
</script>
